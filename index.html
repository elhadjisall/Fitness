<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kids Exercise Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== MENU SECTION ===== -->
  <div id="menu">
    <button id="startBtn">Start Game</button>
    <button id="instructionsBtn">Instructions</button>

    <!-- 🎵 Music Toggle Button -->
    <button id="musicToggleBtn">🎵 Music: Off</button>
  </div>

  <!-- ===== GAME SECTION ===== -->
  <div id="game" style="display:none;">

    <!-- ✅ TIMER MOVED HERE (visible only during gameplay) -->
    <div id="timer" style="display:none;">2:00</div>

    <button id="quitBtn">Quit Game</button>
    <video id="webcam" autoplay playsinline></video>
    <img id="processedImage" src="" alt="Processed Video" style="width: 640px; height: 480px; position: absolute; top: 180px; left: 50%; transform: translateX(-50%); border-radius: 10px; z-index: 10; display: none;">

    <div id="trackingStatus" style="position: absolute; top: 100px; left: 50%; transform: translateX(-50%); z-index: 10; font-size: 1.8em; color: #00aaff; background-color: rgba(0, 0, 0, 0.6); padding: 8px 15px; border-radius: 8px; display: none;">
      <p id="statusDisplay">Waiting for person...</p>
    </div>

    <div id="scores">
      <div class="scoreboard">
        <h2>Player 1</h2>
        <p id="score1">0</p>
      </div>
      <div class="scoreboard">
        <h2>Player 2</h2>
        <p id="score2">0</p>
      </div>
    </div>

    <!-- ===== WINNER POPUP ===== -->
    <div id="popup" style="display: none;">
      <div class="popup-content">
        <h2 id="winnerMessage"></h2>
        
        <!-- AI Analysis Report Section -->
        <div id="aiReport" style="display: none; margin-top: 20px; text-align: left; max-height: 400px; overflow-y: auto;">
          <h3 style="color: #4CAF50; margin-bottom: 15px;">🤖 AI Performance Analysis</h3>
          
          <!-- Game Summary -->
          <div id="gameSummary" style="background: #f0f0f0; padding: 10px; border-radius: 5px; margin-bottom: 15px;"></div>
          
          <!-- Player 1 Analysis -->
          <div id="player1Analysis" style="background: #e8f5e9; padding: 15px; border-radius: 5px; margin-bottom: 15px; border-left: 4px solid #4CAF50;">
            <h4 style="color: #2e7d32; margin-top: 0;">Player 1 Analysis</h4>
            <div id="player1Content"></div>
          </div>
          
          <!-- Player 2 Analysis -->
          <div id="player2Analysis" style="background: #f3e5f5; padding: 15px; border-radius: 5px; margin-bottom: 15px; border-left: 4px solid #9c27b0;">
            <h4 style="color: #7b1fa2; margin-top: 0;">Player 2 Analysis</h4>
            <div id="player2Content"></div>
          </div>
          
          <!-- Comparison -->
          <div id="comparison" style="background: #fff3e0; padding: 10px; border-radius: 5px; border-left: 4px solid #ff9800;"></div>
        </div>
        
        <button id="replayBtn">Replay</button>
        <button id="popupQuitBtn">Quit</button>
      </div>
    </div>
  </div>

  <!-- Update Socket.IO version to match python-socketio -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
